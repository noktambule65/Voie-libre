name: Appli d'essai « Voie libre test »

# Lancée à la main seulement. Compile une copie de Voie libre sous un autre identifiant
# (fr.noktambule.voielibre.test), signée avec une clé jetable : elle s'installe à côté de la vraie
# appli sans la remplacer, et un blocage Play Protect ne touche qu'elle. Publiée sous le nom fixe
# « appli-test » (sans numéro : jamais proposée en mise à jour par Voie libre).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler l'APK d'essai
        env:
          VL_TEST: '1'
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Publier l'essai
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Voie-libre-test.apk
          gh release delete appli-test --cleanup-tag -y || true
          gh release create appli-test Voie-libre-test.apk --title "Voie libre test (appli d'essai)" \
            --notes "Copie d'essai de Voie libre, installée à côté de la vraie appli. Compilée le $(date -u +'%d/%m/%Y à %H:%M') UTC depuis ${GITHUB_SHA::7}. Ne pas diffuser." \
            --prerelease --target "$GITHUB_SHA"
