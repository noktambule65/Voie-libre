name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déchiffrer la clé de signature
        env:
          VOIE_LIBRE_MDP: ${{ secrets.VOIE_LIBRE_MDP }}
        run: |
          if [ -z "$VOIE_LIBRE_MDP" ]; then
            echo "::error::Secret VOIE_LIBRE_MDP absent : Settings › Secrets and variables › Actions › New repository secret"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/voie-libre.jks.chiffre -out app/voie-libre.jks -pass env:VOIE_LIBRE_MDP

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        env:
          VOIE_LIBRE_MDP: ${{ secrets.VOIE_LIBRE_MDP }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk "Voie-libre-v${{ github.run_number }}.apk"

      # Publiée en PRÉ-VERSION : les appli des collègues ne la voient pas.
      # Feu vert après test : modifier la release sur GitHub, décocher « Set as a pre-release »
      # et cocher « Set as the latest release ». Elle est alors proposée à tout le monde.
      - name: Publier dans « Releases » (pré-version à tester)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" "Voie-libre-v${{ github.run_number }}.apk" \
            --title "Voie libre v${{ github.run_number }}" \
            --notes "Nouvelle version de Voie libre." \
            --prerelease

      - name: Effacer la clé déchiffrée
        if: always()
        run: rm -f app/voie-libre.jks
