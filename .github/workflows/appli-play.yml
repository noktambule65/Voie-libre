name: Version Play Store (AAB)

# Lancée à la main seulement. Fabrique le paquet AAB à déposer sur Google Play :
# même code que la version GitHub, mais sans la recherche de mise à jour sur GitHub (règle Google Play).
# Le fichier est rangé dans les « Artifacts » de l'exécution (onglet Actions), pas publié dans les Releases.
on:
  workflow_dispatch:
    inputs:
      numero:
        description: "Numéro de version (doit augmenter à chaque envoi sur Google Play)"
        required: true
      identifiant:
        description: "Identifiant de l'appli sur Google Play (vide = fr.noktambule.voielibre)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le JavaScript de VoieLibre.html
        run: node .github/verifier-js.js app/src/main/assets/VoieLibre.html
      - name: Déchiffrer la clé de signature
        env:
          VOIE_LIBRE_MDP: ${{ secrets.VOIE_LIBRE_MDP }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/voie-libre.jks.chiffre -out app/voie-libre.jks -pass env:VOIE_LIBRE_MDP
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # Nouveautés : intégrées à l'appli (« Quoi de neuf ? ») et préparées pour la Play Console (500 caractères au plus)
      - name: Préparer les nouveautés
        env:
          NUMERO: ${{ inputs.numero }}
        run: |
          cp docs/nouveautes.md app/src/main/assets/nouveautes.md
          python3 - <<'PY'
          import os, re
          n = os.environ['NUMERO']
          t = open('docs/nouveautes.md', encoding='utf-8').read()
          m = re.search(r'^##\s*(?:1\.)?' + re.escape(n) + r'\s*$(.*?)(?=^##\s|\Z)', t, re.M | re.S)
          if not m:
              print(f"::warning::Aucune section « ## 1.{n} » dans docs/nouveautes.md : « Quoi de neuf ? » montrera la précédente.")
              open('notes-play.txt', 'w', encoding='utf-8').write('')
          else:
              txt = m.group(1).strip()
              txt = re.sub(r'\*\*(.+?)\*\*', r'\1', txt)
              txt = re.sub(r'^\s*[-*]\s+', '• ', txt, flags=re.M)
              txt = re.sub(r'\n{3,}', '\n\n', txt)
              open('notes-play.txt', 'w', encoding='utf-8').write('<fr-FR>\n' + txt + '\n</fr-FR>\n')
              if len(txt) > 500:
                  print(f"::warning::Note de version de {len(txt)} caractères : la Play Console en accepte 500 au plus. À raccourcir dans docs/nouveautes.md.")
          PY
      - name: Compiler l'AAB
        env:
          VOIE_LIBRE_MDP: ${{ secrets.VOIE_LIBRE_MDP }}
          VL_NUMERO: ${{ inputs.numero }}
          VL_ID: ${{ inputs.identifiant }}
        run: gradle bundlePlayRelease --no-daemon --stacktrace
      - name: Autorisations de la version Play (contrôle)
        run: |
          m=$(find app/build/intermediates -path '*playRelease*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "Manifeste fusionné : $m"; grep -o 'uses-permission[^>]*' "$m"
          if grep -q 'USE_EXACT_ALARM' "$m"; then echo "::error::USE_EXACT_ALARM ne doit pas figurer dans la version Play"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Voie-libre-play-${{ inputs.numero }}
          path: |
            app/build/outputs/bundle/playRelease/app-play-release.aab
            notes-play.txt
      - if: always()
        run: rm -f app/voie-libre.jks
