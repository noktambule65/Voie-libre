plugins {
    id 'com.android.application'
}

// Le numéro de version suit le numéro de compilation GitHub : chaque APK remplace le précédent.
def numero = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
// Mot de passe de la clé de signature : secret VOIE_LIBRE_MDP du dépôt (jamais écrit dans le code).
def mdp = System.getenv('VOIE_LIBRE_MDP')
// Appli d'essai (VL_TEST=1) : autre identifiant, autre nom, clé jetable — s'installe à côté de la vraie, sans la toucher.
def estEssai = System.getenv('VL_TEST') == '1'

android {
    namespace 'fr.noktambule.voielibre'
    compileSdk 36

    defaultConfig {
        applicationId estEssai ? 'fr.noktambule.voielibre.test' : 'fr.noktambule.voielibre'
        manifestPlaceholders = [nomAppli: estEssai ? 'Voie libre test' : 'Voie libre']
        minSdk 29
        targetSdk 36
        versionCode numero
        versionName "1.${numero}"
    }

    // Clé de signature fixe (déchiffrée par GitHub Actions) : indispensable pour installer les mises à jour par-dessus.
    signingConfigs {
        voielibre {
            storeFile file('voie-libre.jks')
            storePassword mdp
            keyAlias 'voielibre'
            keyPassword mdp
        }
        essai {
            storeFile file('essai.jks')
            storePassword 'voielibre-essai'
            keyAlias 'essai'
            keyPassword 'voielibre-essai'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (estEssai) signingConfig signingConfigs.essai
            else if (mdp) signingConfig signingConfigs.voielibre
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
}
